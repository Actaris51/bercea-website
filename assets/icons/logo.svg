<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Bercea logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242a4a"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (app icon style) -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Tiny stars -->
  <circle cx="22" cy="28" r="1.2" fill="#e9d5ff" opacity="0.85"/>
  <circle cx="80" cy="22" r="0.9" fill="#e9d5ff" opacity="0.7"/>
  <circle cx="18" cy="50" r="0.7" fill="#e9d5ff" opacity="0.6"/>
  <circle cx="85" cy="55" r="1" fill="#e9d5ff" opacity="0.8"/>

  <!-- Crescent moon (cradled) -->
  <path d="M 65 30
           A 22 22 0 1 0 65 74
           A 17 17 0 1 1 65 30 Z"
        fill="url(#moon)"/>

  <!-- Rocking arc below (the "bercement") -->
  <path d="M 16 82 Q 50 70 84 82"
        stroke="url(#arc)"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"/>

  <!-- Subtle accent dot where the moon "rests" -->
  <circle cx="50" cy="75" r="1.5" fill="#fbbf24" opacity="0.7"/>
</svg>
